[project]
name = "byte-studio"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["backups", "artifacts", "tmpopq04t5f", "tmpurwt027e"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S105", "S106", "S311"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "backups/*", "artifacts/*", "tmp*/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
